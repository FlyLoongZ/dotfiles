#!/usr/bin/env python3
import os
import sys
import subprocess
import yaml

tmpl_path = os.path.join(
    os.environ.get("CHEZMOI_SOURCE_DIR", ""), 
    "dot_dsh/models.yaml"
)

with open(tmpl_path, "rb") as f:
    rendered = subprocess.check_output(
        ["chezmoi", "execute-template"], 
        input=f.read()
    ).decode("utf-8")
fixed = yaml.safe_load(rendered) or {}

current = yaml.safe_load(sys.stdin.read()) or []
if not isinstance(current, list):
    current = []

entry = next(
    (e for e in current if isinstance(e, dict) and e.get("id") == "llm-pi-ai"),
    None,
)
if entry is None:
    entry = {
        "id": "llm-pi-ai",
        "name": "@deepseek-ai/dsh-llm-pi-ai",
        "config": {},
    }
    current.append(entry)
entry.setdefault("config", {})["providers"] = fixed

yaml.dump(current, sys.stdout, sort_keys=False, allow_unicode=True)