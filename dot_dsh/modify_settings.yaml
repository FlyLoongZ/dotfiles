#!/usr/bin/env python3
import os
import sys
import subprocess
import yaml

def deep_merge(source, destination):
    for k, v in source.items():
        if isinstance(v, dict) and k in destination and isinstance(destination[k], dict):
            deep_merge(v, destination[k])
        else:
            destination[k] = v
    return destination

tmpl_path = os.path.join(
    os.environ.get("CHEZMOI_SOURCE_DIR", ""), 
    "dot_dsh/models.yaml"
)

fixed_data = {}
if os.path.exists(tmpl_path):
    with open(tmpl_path, "rb") as f:
        rendered_yaml = subprocess.check_output(
            ["chezmoi", "execute-template"], 
            input=f.read()
        ).decode("utf-8")
    fixed_data = yaml.safe_load(rendered_yaml) or {}

raw_stdin = sys.stdin.read()
current_data = {}
if raw_stdin.strip():
    try:
        current_data = yaml.safe_load(raw_stdin) or {}
    except Exception:
        current_data = {}

if not isinstance(current_data, dict):
    current_data = {}

deep_merge(fixed_data, current_data)
yaml.dump(current_data, sys.stdout, sort_keys=False, allow_unicode=True)