<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>

    <!-- 默认 system-ui 字体 -->
    <alias>
        <family>system-ui</family>
        <prefer>
            <family>WenYuan Sans SC VF</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- 默认 sans-serif 字体 -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>WenYuan Sans SC VF</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- 默认 serif 字体 -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>WenYuan Serif SC VF</family>
            <family>Noto Serif CJK SC</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- 默认 monospace 字体 -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Maple Mono NL CN</family>
            <family>Noto Sans Mono CJK SC</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- 字体目录 -->
    <dir>~/.local/share/fonts</dir>

    <!-- 字体渲染设置 -->
    <match target="font">
        <edit mode="assign" name="rgba">
            <const>rgb</const>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="hinting">
            <bool>false</bool>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="hintstyle">
            <const>hintnone</const>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="antialias">
            <bool>true</bool>
        </edit>
    </match>

</fontconfig>